<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Nexus Site</title>

</head>

<body id="mapeamento-page">
  <main>
      <nav class="navbar navbar-expand-sm navbar-dark fixed-top navbar-gradient">
        <div class="container-fluid">
          <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <img src="./images/NEXUS.svg" alt="Nexus Logo" class="nexus-logo">
          </a>    
          <div class="d-flex ms-auto align-items-center gap-5">
            <form class="d-flex align-items-center">
              <div class="input-group rounded-input-group">
                <span class="input-group-text search-icon">🔍︎</span>
                <input class="form-control rounded-end" type="text" placeholder="Procurar">
              </div>
              <button class="button-search" type="button">Buscar</button>
            </form>

            <button onclick="myFunction()">☀︎/⏾</button>
          </div>

          <script>
            window.addEventListener("DOMContentLoaded", () => {
              document.documentElement.classList.add("disable-transitions");
          
              const savedTheme = localStorage.getItem("theme");
              if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
              }
          
              setTimeout(() => {
                document.documentElement.classList.remove("disable-transitions");
              }, 100);
            });

            function myFunction() {
              const isDark = document.body.classList.toggle("dark-mode");
              localStorage.setItem("theme", isDark ? "dark" : "light");
            }
          </script>
        </div>
      </nav>

      <!-- Sidebar -->
      <div>
        <ul class="sidebar">
        <li><a href="index.html">5 Maiores</a></li>
        <li><a href="municipios.html">Municípios</a></li>
        <li><a href="variacao.html">Variação Sazonal</a></li>
        <li><a href="comparacao-municipios.html">Comparação de Municípios</a></li>
        <li><a class="active" href="mapeamento.html">Mapeamento</a></li>
        <li><a href="">Balança Comercial</a></li>
      </ul>
      </div>
  </main>

</body>
</html>
